name: Bug in the site
description: Something looks broken or behaves wrongly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened, description: "What you did, what you expected, what you saw. A screenshot helps."}
    validations: {required: true}
  - type: input
    id: where
    attributes: {label: Page or link, placeholder: "https://jackpison.github.io/Market-Prism/#radar/vix"}
  - type: input
    id: env
    attributes: {label: Browser, device and theme, placeholder: "Safari on iPhone, dark theme"}
