name: Data · trend signals
run-name: Trend signals refresh (${{ github.event_name }})

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: update-trends
  cancel-in-progress: false

jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and score trends
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}          # optional: enables the Reddit narrative source
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python scripts/fetch_trends.py
      - name: Validate data files
        run: python tests/validate_data.py
      - name: Job summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          try:
              D = json.load(open("data/macro_data.json"))
              print("### Trend signals\n")
              print("%d trends, %d signals. Updated %s.\n" % (len(D["trends"]), len(D["signals"]), D["generated"]))
              print("| Source | State | OK | Failed |\n|---|---|---|---|")
              for k, v in sorted(D.get("status", {}).items()): print("| %s | %s | %s | %s |" % (k, v.get("state"), v.get("ok"), v.get("fail")))
          except Exception as e:
              print("No summary available:", e)
          PY
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/macro_data.json data/trends_history.json
          git diff --staged --quiet || git commit -m "Update trends $(date -u +%FT%H:%MZ)"
          git pull --rebase -q
          git push
