name: Data · macro indicators
run-name: Macro indicators refresh (${{ github.event_name }})

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * 1-5'   # weekdays, after the US close (UTC)

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Long-history market series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_market_data.py
        continue-on-error: true
      - name: Daily macro series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_macro.py
        continue-on-error: true
      - name: Compute indicators, heatmap, yield curve, stress betas
        run: python scripts/build_indicators.py
      - name: Backtest indicators against recessions and bear markets
        run: python scripts/backtest.py
        continue-on-error: true
      - name: Daily composite history and logs (append only)
        run: python scripts/build_history.py
        continue-on-error: true   # a problem here must never block the main data refresh; the validation step below still checks the files
      - name: Validate data files
        run: python tests/validate_data.py
      - name: Job summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          try:
              L = json.load(open("data/indicators/latest.json"))
              print("### Macro indicators\n")
              print("**%s** (composite %s) from %d of %d indicators with fresh data.\n" % (L["regime"], round(L["composite"]), L["coverage"]["with_data"], L["coverage"]["total"]))
              bad = [i for i in L["indicators"] if i["status"] in ("red", "yellow")]
              if bad:
                  print("| Indicator | Value | Status |\n|---|---|---|")
                  for i in bad: print("| %s | %s | %s |" % (i["name"], i["value"], i["status"]))
          except Exception as e:
              print("No summary available:", e)
          try:
              idx = json.load(open("data/macro/index.json"))
              if idx.get("failed"): print("\nFailed series:", ", ".join(map(str, idx["failed"])))
          except Exception: pass
          PY
      - name: Commit results
        uses: ./.github/actions/commit-data
        with:
          paths: data
          message: Update data
