name: CI · tests and checks

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'          # the scheduled data commits are validated by the data workflows themselves

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and data validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PyYAML (workflow lint)
        run: pip install pyyaml
      - name: Workflow lint (timeouts, permissions, concurrency, pinned actions)
        run: python tests/check_workflows.py
      - name: Pipeline regression tests (GDELT queries, source states, backoff, Form D parser)
        run: python tests/test_pipeline_fixes.py
      - name: Alert detection tests
        run: python tests/test_alerts.py
      - name: Data-freshness watchdog tests
        run: python tests/test_watchdog.py
      - name: Trend pipeline self-test (mocked HTTP; writes to a temp dir, never to data/)
        run: TRENDS_OUT="$RUNNER_TEMP/trends" python tests/selftest_trends.py
      - name: Validate committed data and config
        run: python tests/validate_data.py
      - name: Scoring and regime tests
        run: python tests/test_scoring.py
      - name: Weekly digest tests
        run: python tests/test_digest.py
      - name: Design-token contrast (WCAG AA)
        run: python tests/check_contrast.py
      - name: Backtest runs on committed data
        run: python scripts/backtest.py

  browser:
    name: Browser smoke test (13 pages x dark/light x desktop/phone)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Playwright (not added to the repo)
        run: npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.49.1 axe-core@4.10.2
      - name: Cache the Chromium download
        id: pwcache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.49.1-chromium-${{ runner.os }}
      - name: Install Chromium (full on a cache miss; only system libraries on a hit)
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            npx --prefix "$RUNNER_TEMP/pw" playwright install-deps chromium
          else
            npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
          fi
      - name: Serve the site and run the smoke test
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          cp tests/*.mjs "$RUNNER_TEMP/pw/"   # visual.mjs reads its baselines from tests/visual via VISUAL_DIR
          cd "$RUNNER_TEMP/pw"
          node smoke.mjs http://localhost:8000/index.html
          node features.mjs http://localhost:8000/index.html
          node a11y.mjs http://localhost:8000/index.html
          VISUAL_DIR="$GITHUB_WORKSPACE/tests/visual" node visual.mjs "$RUNNER_TEMP/visual-diff" http://localhost:8000/index.html
      - name: Upload visual diffs (only when the visual check failed)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: ${{ runner.temp }}/visual-diff
          retention-days: 7
          if-no-files-found: ignore
      - name: Screenshot gallery (for review; not a pixel-diff test)
        if: always()
        run: cd "$RUNNER_TEMP/pw" && node screens.mjs "$RUNNER_TEMP/shots" http://localhost:8000/index.html
      - name: Upload the gallery
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 7
          if-no-files-found: ignore

  preview:
    name: Build the single-file preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build dist/marketprism.html
        run: python scripts/build_single.py
      - name: Upload the preview (download it from the run summary and open it from disk)
        uses: actions/upload-artifact@v7
        with:
          name: marketprism-preview-${{ github.event.pull_request.number }}
          path: dist/marketprism.html
          retention-days: 7
          if-no-files-found: error
